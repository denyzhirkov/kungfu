[package]
name = "kungfu-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "kungfu"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
kungfu-types = { workspace = true }
kungfu-config = { workspace = true }
kungfu-project = { workspace = true }
kungfu-core = { workspace = true }
kungfu-memory = { workspace = true }
kungfu-output = { workspace = true }
kungfu-index = { workspace = true }
kungfu-git = { workspace = true }
kungfu-mcp = { workspace = true }
kungfu-embed = { workspace = true }
kungfu-storage = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }

[features]
default = []
# Enables real candle-based embedding inference once kungfu-embed/inference is filled in.
semantic = ["kungfu-embed/inference"]
