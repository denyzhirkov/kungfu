[package]
name = "kungfu-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "kungfu"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
kungfu-types = { workspace = true }
kungfu-config = { workspace = true }
kungfu-project = { workspace = true }
kungfu-core = { workspace = true }
kungfu-memory = { workspace = true }
kungfu-output = { workspace = true }
kungfu-index = { workspace = true }
kungfu-git = { workspace = true }
kungfu-mcp = { workspace = true }
kungfu-embed = { workspace = true }
kungfu-update = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }

[features]
# Vector search ships by default — it is the differentiating feature. Opt out with
# `cargo build --no-default-features` for a slim binary (keyword fallback only).
default = ["semantic"]
semantic = ["kungfu-embed/inference"]
