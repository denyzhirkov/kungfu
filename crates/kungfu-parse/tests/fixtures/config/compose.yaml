# docker-compose
version: "3.9"
x-common: &common
  restart: unless-stopped
  environment:
    - A=1
services:
  web:
    <<: *common
    image: nginx:1.25
    ports:
      - "80:80"
      - "443:443"
    environment:
      DB_PASSWORD: hunter2
  db:
    image: postgres:16
    command: |
      postgres
      -c max_connections=200
volumes:
  data: {}
  cache: {size: 1, mode: rw}
networks: *common
"quoted name": 'single'
